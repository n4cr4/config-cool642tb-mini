# cool642tb-mini 共通設定（左右共通）
# ZMK_CONFIG直下に配置。ビルド時にcool642tb-mini_R/Lの両方へ自動マージされる。
# ※Nixビルドで認識されるには git add が必須（未追跡ファイルは無視される）

# ハードウェア
CONFIG_NFCT_PINS_AS_GPIOS=y

# ロータリーエンコーダ (EC11)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# バッテリー
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n

# 無線・BLE
CONFIG_BT_DEVICE_NAME_MAX=30
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_ZMK_POINTING=y
# 電源管理: 15分無操作でDeep Sleep（kscan0のwakeup-source;でキー押下復帰）
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_HID_SEPARATE_MOD_RELEASE_REPORT=y
# BLE接続パラメータ
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=8
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
